name: CRM v2 validation
on:
  push:
    branches: ['codex/crm-v2-foundation']
    paths: ['crm-v2/**', '.github/workflows/crm-v2.yml']
  pull_request:
    paths: ['crm-v2/**', '.github/workflows/crm-v2.yml']
permissions:
  contents: read
concurrency:
  group: crm-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mysql-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crm-v2
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: koza_ci
          MYSQL_USER: koza_ci
          MYSQL_PASSWORD: ci-disposable-only
          MYSQL_ROOT_PASSWORD: ci-root-disposable-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: koza_ci
      DB_USERNAME: koza_ci
      DB_PASSWORD: ci-disposable-only
      APP_ENV: testing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, bcmath, dom, xml, zip
          tools: composer:2
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: MySQL feature tests
        run: composer test
      - name: Blade compilation
        run: php artisan view:cache
