/* giriş animasyonu (koza) */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% 10%,rgba(169,185,122,.18),transparent 70%),radial-gradient(800px 500px at 90% 100%,rgba(196,103,60,.14),transparent 70%),#232b18;opacity:0;transition:opacity .45s}
#intro.show{opacity:1}
#intro.out{opacity:0}
#intro svg{width:min(1100px,94vw);height:auto;overflow:visible}
#intro .skip{position:absolute;right:20px;bottom:18px;color:#8e8a76;font-size:12px}
#thread path{fill:none;stroke:#f4efe0;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(244,239,224,.45))}
@media(max-width:640px){#intro{display:none}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}

/* ürün drawer */
#pdrawer-overlay{position:fixed;inset:0;background:#102d2570;backdrop-filter:blur(3px);z-index:25}
#pdrawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--paper);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s ease;z-index:26;display:flex;flex-direction:column}
#pdrawer.on{transform:none}
.pd-head{padding:18px 22px;border-bottom:1px solid var(--line);background:white;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pd-head b{font-family:Georgia,serif;font-size:21px;font-weight:400}
.pd-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.pd-body{overflow:auto;padding:16px 22px;flex:1}
.pd-foot{padding:14px 22px;border-top:1px solid var(--line);background:#fafbf7;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pd-foot .note{font-size:11px;color:var(--muted)}
.pd-acc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:white;overflow:hidden}
.pd-acc summary{padding:11px 14px;font-weight:600;font-size:13px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.pd-acc summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:transform .15s}
.pd-acc:not([open]) summary::after{transform:rotate(-90deg)}
.pd-acc .fs{padding:4px 14px 14px;display:grid;gap:10px}
.pd-acc .fs.two{grid-template-columns:1fr 1fr;display:grid}
.pd-miss{background:#faf1df;color:#916021;border-radius:8px;padding:9px 13px;font-size:12px;margin-bottom:10px}
.pd-flabel{display:grid;gap:4px;font-size:12px;font-weight:500}
.pd-flabel .u{font-size:11px;color:var(--muted);font-weight:400}
.pd-flabel .req{color:var(--red)}
.pd-line{display:grid;grid-template-columns:1fr 96px auto;gap:6px;align-items:center}
.pd-line3{display:grid;grid-template-columns:1fr 1fr 76px auto;gap:6px;align-items:center}
.pd-chips{display:flex;flex-wrap:wrap;gap:6px}
.pd-chips label{border:1px solid var(--line);border-radius:99px;padding:4px 11px;display:flex;gap:6px;align-items:center;font-size:12px;background:white;cursor:pointer}
.pd-ro{background:#f0f2ef;color:#69766c}
.pd-tot{font-weight:600}
.pd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pd-card{background:white;border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.pd-card:hover{border-color:#8da58c}
.pd-card h3{margin:0;font-size:14px;font-weight:600;flex:1}
.pd-card .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.pd-card .kv span:nth-child(odd){color:var(--muted)}
.pd-card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.log-item{padding:14px 22px;border-top:1px solid #f0f2ec}.log-item:first-child{border-top:0}.log-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chg{margin-top:8px;background:#fafbf7;border:1px solid #eef1e8;border-radius:8px;padding:8px 12px}.chg-row{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:3px 0;flex-wrap:wrap}.chg-f{font-weight:600;min-width:110px;color:var(--ink)}.chg-old{color:var(--red);text-decoration:line-through;text-decoration-color:#c9b0ab}.chg-new{color:#2f6f4f;font-weight:500}.chg-arrow{color:var(--muted)}
.dropzone{border:2px dashed #c4d0bf;border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:#fbfcf9;transition:background .15s,border-color .15s}.dropzone.over{background:#eef3e9;border-color:#5d8452}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}.shot{margin:0;background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:zoom-in}.shot img{display:block;width:100%;height:92px;object-fit:cover}.shot figcaption{display:flex;align-items:center;gap:5px;padding:5px 7px;font-size:10px;color:var(--muted)}.shot figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.shot-del{border:0;background:none;color:var(--red);cursor:pointer;padding:0 2px;font-size:11px}.shot-del:hover{color:#7c2d24}
.lightbox{display:none;position:fixed;inset:0;background:#0d231cf2;z-index:60;flex-direction:column}.lightbox.open{display:flex}.lb-top{display:flex;align-items:center;gap:12px;padding:14px 20px;color:#e4eee7}.lb-title{font-weight:500;font-size:13px}.lb-count{color:#a7c1b0;font-size:12px}.lb-tools{margin-left:auto;display:flex;gap:6px}.lb-btn{background:#1c4437;border:1px solid #35624f;color:#e4eee7;border-radius:7px;width:36px;height:36px;font-size:16px;cursor:pointer}.lb-btn:hover{background:#245347}.lb-danger{color:#f0b9ae}.lb-stage{flex:1;display:grid;place-items:center;overflow:hidden;padding:0 64px}.lb-stage img{max-width:100%;max-height:100%;transform-origin:center center;transition:transform .12s;cursor:grab;border-radius:4px;box-shadow:0 12px 60px #00000080}.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:#1c4437cc;border:1px solid #35624f;color:#e4eee7;font-size:42px;width:52px;height:74px;cursor:pointer;border-radius:10px;line-height:1}.lb-prev{left:8px}.lb-next{right:8px}.lb-nav:hover{background:#245347}.lb-caption{padding:10px 20px;color:#a7c1b0;font-size:12px;text-align:center}
.phone-row{display:grid;grid-template-columns:110px 95px 1fr 36px;gap:8px;margin-bottom:8px}.phone-row .phone-num{width:100%}.phone-del{padding:6px 0}.info .pline{display:flex;gap:8px;align-items:baseline}.info .pline .cc{color:var(--muted)}
.ct-head{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1fr 28px 28px;gap:6px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.contact-row{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1fr 28px 28px;gap:6px;margin-bottom:6px;align-items:center}.contact-row input{padding:8px 10px;font-size:12px}.pc-5{display:grid;place-items:center}.pc-5 input{accent-color:var(--green);width:16px;height:16px}.contact-row.is-primary{background:#f4f8ee;border-radius:8px;padding:4px 3px;margin-left:-3px;margin-right:-3px}.info .ctline{margin:7px 0}.info .ctline small.tt{display:inline-block;background:#edf2eb;color:#526b4f;border-radius:5px;padding:2px 6px;font-size:10px;margin-left:6px}.info .ctline .st{color:#916021;font-size:10px;margin-left:6px}.closed-deals{margin-top:12px}.amounts{display:flex;gap:18px;flex-wrap:wrap}.amounts span{font-size:12px;color:var(--muted)}.amounts strong{font-size:19px;font-weight:500;color:var(--ink);display:block}
/* auth ekranı */

<script>
'use strict';
/* ============ yardımcılar ============ */
const APP_VERSION='V1.10.0';

/* koza logosu (sidebar + auth) */
const NX_LOGO_SVG = `<svg class="logo-big" viewBox="0 0 40 46" aria-hidden="true"><defs><linearGradient id="nxkg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4efe0"/><stop offset="1" stop-color="#c9d29c"/></linearGradient></defs><ellipse cx="20" cy="24" rx="14" ry="19" fill="url(#nxkg)"/><path d="M8 16c8 5 16 5 24 0M7 25c9 5 17 5 26 0M9 33c8 4 14 4 22 0" fill="none" stroke="#8fa05a" stroke-width="1.3" stroke-linecap="round"/><path d="M20 5c0-3 3-4 5-3" fill="none" stroke="#c4673c" stroke-width="2" stroke-linecap="round"/></svg>`;

/* @norm-core-start — Türkçe yazı düzeni çekirdeği (PHP karşılığı: norm.php; kurallar birebir aynı) */
const NX_TR_UPPER = {'ç':'Ç','ğ':'Ğ','ı':'I','i':'İ','ö':'Ö','ş':'Ş','ü':'Ü','a':'A','b':'B','c':'C','d':'D','e':'E','f':'F','g':'G','h':'H','j':'J','k':'K','l':'L','m':'M','n':'N','o':'O','p':'P','q':'Q','r':'R','s':'S','t':'T','u':'U','v':'V','w':'W','x':'X','y':'Y','z':'Z'};
const NX_TR_LOWER = {'Ç':'ç','Ğ':'ğ','I':'ı','İ':'i','Ö':'ö','Ş':'ş','Ü':'ü','A':'a','B':'b','C':'c','D':'d','E':'e','F':'f','G':'g','H':'h','J':'j','K':'k','L':'l','M':'m','N':'n','O':'o','P':'p','Q':'q','R':'r','S':'s','T':'t','U':'u','V':'v','W':'w','X':'x','Y':'y','Z':'z'};
const nx_tr_upper = s => String(s).replace(/./g, c => NX_TR_UPPER[c] || c);
const nx_tr_lower = s => String(s).replace(/./g, c => NX_TR_LOWER[c] || c);
const NX_DEFAULT_EXCEPTIONS = ['OEKO-TEX', 'GOTS', 'BCI', 'AQL', 'A.Ş.', 'Ltd. Şti.', 'PVC', 'EUR', 'USD', 'iPhone', 'eBay'];
const NX_CONNECTORS = ['ve', 'ile', 'için', 'ya', 'da', 'veya'];
const NX_UNITS = ['gr', 'kg', 'mg', 'lt', 'cm', 'mm', 'm', 'km', 'adet', 'çift'];
function nx_exception_pattern(e) {
  let out = '';
  for (const ch of e) {
    if (/\p{L}/u.test(ch)) out += '[' + nx_tr_lower(ch) + nx_tr_upper(ch) + ']';
    else out += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  return new RegExp('(?<![\\p{L}\\p{N}])' + out + '(?![\\p{L}])', 'gu');
}
function nx_title(s, connOn, connectors, units) {
  const re = /((?:[\p{L}\p{M}\p{N}\u0001\uE000-\uF8FF])+(?:['’][\p{L}\p{M}\p{N}\u0001\uE000-\uF8FF]+)*)/gu;
  const parts = s.split(re);
  const tokenIdx = []; const hasDigit = [];
  parts.forEach((p, i) => { hasDigit[i] = /\p{N}/u.test(p); if (/^[\p{L}\p{N}\u0001\uE000-\uF8FF]/u.test(p)) tokenIdx.push(i); });
  for (let k = 0; k < tokenIdx.length; k++) {
    const i = tokenIdx[k];
    if (!/^\p{L}/u.test(parts[i])) continue;
    const w = parts[i];
    const lw = nx_tr_lower(w), uw = nx_tr_upper(w);
    const isLower = lw === w, isUpper = uw === w;
    const mixed = !isLower && !isUpper;
    if (hasDigit[i]) continue;
    if (!mixed && units.includes(lw)) {
      const prevT = k > 0 ? tokenIdx[k - 1] : -1, nextT = k + 1 < tokenIdx.length ? tokenIdx[k + 1] : -1;
      if ((prevT >= 0 && hasDigit[prevT]) || (nextT >= 0 && hasDigit[nextT])) continue;
    }
    if (mixed) continue;
    if (connOn && k > 0 && connectors.includes(lw)) { parts[i] = lw; continue; }
    parts[i] = nx_tr_upper(w[0]) + nx_tr_lower(w.slice(1));
  }
  return parts.join('');
}
function nx_sentence(s) {
  let out = '', boundary = true;
  for (const ch of s) {
    if (/[.!?…]/.test(ch)) { out += ch; boundary = true; continue; }
    if (boundary) {
      if (/\p{L}/u.test(ch)) { out += nx_tr_upper(ch); boundary = false; continue; }
      if (/\s/u.test(ch)) { out += ch; continue; }
      out += ch; boundary = false; continue;
    }
    out += ch;
  }
  return out;
}
function nx_norm(s, format = 'none', opts = {}) {
  format = ['title', 'sentence', 'upper', 'none'].includes(format) ? format : 'none';
  s = String(s).replace(/\s+/g, ' ').replace(/ {2,}/g, ' ').trim();
  if (!s || format === 'none') return s;
  const exceptions = opts.exceptions || NX_DEFAULT_EXCEPTIONS;
  const connOn = opts.connectors !== false;
  const connectors = NX_CONNECTORS, units = NX_UNITS;
  const placeholders = [];
  exceptions.forEach((e, i) => {
    if (!e) return;
    s = s.replace(nx_exception_pattern(e), () => { placeholders[i] = e; return '\u0001' + String.fromCharCode(0xE000 + i) + '\u0001'; });
  });
  if (format === 'upper') s = nx_tr_upper(s);
  else if (format === 'title') s = nx_title(s, connOn, connectors, units);
  else if (format === 'sentence') s = nx_sentence(s);
  placeholders.forEach((canon, i) => { s = s.split('\u0001' + String.fromCharCode(0xE000 + i) + '\u0001').join(canon); });
  return s;
}
/* @norm-core-end */
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGES=['İhtiyaç','Teklif hazırlanıyor','Teklif gönderildi','Müzakere','Sipariş onayı'];
const TASK_STATUSES=['Yapılacak','Devam ediyor','Bekliyor','Tamamlandı'];
const WAITING=['Biz','Müşteri','Tedarikçi'];
const COMPANY_STATUS=['Aday','Aktif müşteri','Pasif'];
const SOURCES=['Referans','Fuar','Web sitesi','E-posta','Telefon','İş ortağı','Diğer'];
const PROJECT_TYPES=['Numune','Sipariş','İç geliştirme'];
const CURRENCY_OPTS=[{value:'USD',label:'USD — Amerikan Doları'},{value:'EUR',label:'EUR — Euro'},{value:'TRY',label:'TL — Türk Lirası'}];
const NOTE_TYPES=['E-posta','Telefon','Toplantı','Fuar','WhatsApp','Not'];
const CURRENCIES=['USD','EUR','TRY'];
const PHONE_TYPES=['Cep','İş','Diğer'];
const CC_LIST=['+90','+1','+44','+49','+33','+31','+39','+34','+46','+47','+45','+358','+971','+966','+20','+212','+216','+7','+86','+81','+82','+91','+61','+55','+233','+234'];
const GEO={'Türkiye':['İstanbul','Ankara','İzmir','Bursa','Antalya','Adana','Konya','Gaziantep','Kayseri','Eskişehir','Samsun','Denizli','Trabzon','Mersin','Muğla'],'Almanya':['Berlin','München','Hamburg','Frankfurt','Köln','Stuttgart','Düsseldorf'],'İngiltere':['London','Manchester','Birmingham','Liverpool','Leeds'],'Amerika Birleşik Devletleri':['New York','Los Angeles','Chicago','Houston','Miami','San Francisco'],'Fransa':['Paris','Lyon','Marseille','Toulouse','Nice'],'Hollanda':['Amsterdam','Rotterdam','The Hague','Utrecht'],'İtalya':['Milano','Roma','Torino','Firenze','Venezia'],'İspanya':['Madrid','Barcelona','Valencia','Sevilla'],'İsveç':['Stockholm','Göteborg','Malmö'],'Norveç':['Oslo','Bergen','Stavanger'],'Danimarka':['København','Aarhus','Odense'],'Finlandiya':['Helsinki','Espoo','Tampere'],'Birleşik Arap Emirlikleri':['Dubai','Abu Dhabi','Sharjah'],'Suudi Arabistan':['Riyadh','Jeddah','Dammam'],'Mısır':['Kahire','İskenderiye'],'Fas':['Casablanca','Rabat','Marrakech'],'Tunus':['Tunus','Sfax'],'Rusya':['Moskova','St. Petersburg'],'Çin':['Şanghay','Pekin','Shenzhen','Guangzhou'],'Japonya':['Tokyo','Osaka','Nagoya'],'Kore':['Seul','Busan'],'Hindistan':['Mumbai','Delhi','Bangalore'],'Avustralya':['Sydney','Melbourne','Brisbane'],'Brezilya':['São Paulo','Rio de Janeiro'],'Gana':['Akra','Kumasi','Takoradi'],'Nijerya':['Lagos','Abuja','Kano']};
function geoCountries(){const set=new Set(Object.keys(GEO));cache.companies.forEach(c=>{if(c.country)set.add(c.country)});return [...set].sort((a,b)=>a.localeCompare(b,'tr'))}
function geoCities(country){const set=new Set(GEO[country]||[]);cache.companies.forEach(c=>{if(c.country===country&&c.city)set.add(c.city)});return [...set].sort((a,b)=>a.localeCompare(b,'tr'))}
const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dateLabel=d=>!d?'Tarih yok':d===day()?'Bugün':d===day(1)?'Yarın':new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const initials=s=>String(s||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toLocaleUpperCase('tr');
const money=(n,c)=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:c,maximumFractionDigits:0}).format(n);
const tsLabel=ts=>new Date(ts*1000).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let toastTimer;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}

/* ============ API katmanı ============ */
async function api(path,body){
  const opt=body!==undefined?{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'niateks'},body:JSON.stringify(body)}:{method:'GET'};
  let r;
  try{r=await fetch('/api'+path,opt)}
  catch(e){throw new Error('Sunucuya ulaşılamıyor. Bağlantınızı kontrol edin.')}
  if(r.status===204)return null;
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d?.error||('İstek başarısız ('+r.status+')'));
  return d;
}

/* ============ durum ============ */
let me=null,users=[],view='today',selected='',query='',ownerFilter='',taskFilter='open',homeFilter='today',customerTab='overview',logFilter={username:'',entity:'',q:''},logTab='islem',loginsCache=[];
let cache={dashboard:null,companies:[],deals:[],tasks:[],projects:[],reports:null,activity:[],log:[]};
const company=id=>cache.companies.find(c=>c.id===id);
const companyName=id=>company(id)?.name||'İç çalışma';
const dealById=id=>cache.deals.find(d=>d.id===id);
const projectById=id=>cache.projects.find(p=>p.id===id);
const userById=id=>users.find(u=>u.id===id);
const userName=id=>userById(id)?.name||'—';
function activeDeals(){return cache.deals.filter(d=>STAGES.includes(d.stage))}
function openTasks(){return cache.tasks.filter(t=>t.status!=='Tamamlandı')}
function hasNextDeal(d){return cache.tasks.some(t=>t.deal_id===d.id&&t.status!=='Tamamlandı'&&t.due_date>=day())}
function match(...parts){return parts.join(' ').toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr'))}
function tag(t,kind=''){return `<span class="tag ${kind}">${esc(t)}</span>`}
function btn(t,a,id='',kind=''){return `<button class="button ${kind}" data-action="${a}" data-id="${esc(id)}">${t}</button>`}
function header(title,sub,action=''){let html=esc(title);if(view==='today'&&me){const h=new Date().getHours();const selam=h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar';html=`${esc(selam)}, <em>${esc(me.name.split(' ')[0])}</em>.`}return `<div class="page-head"><div><div class="eyebrow">KOZA HOUSE · CRM</div><h1>${html}</h1><p class="sub">${esc(sub)}</p></div><div class="actions">${action}</div></div>`}
function options(vals,current){return vals.map(v=>{const a=typeof v==='string'?{value:v,label:v}:v;return `<option value="${esc(a.value)}" ${String(a.value)===String(current)?'selected':''}>${esc(a.label)}</option>`}).join('')}
function userOpts(current,withEmpty=''){const list=users.map(u=>({value:u.id,label:u.name}));return options(withEmpty?[{value:'',label:withEmpty},...list]:list,current)}
function userList(current,withEmpty=''){return users.map(u=>({value:u.id,label:u.name})).concat(withEmpty?[{value:'',label:withEmpty}]:[])}
function companyList(current=''){return cache.companies.map(c=>({value:c.id,label:c.name})).concat([{value:'',label:'İç çalışma / müşteri yok'}])}
function stat(label,value,foot,action='',id='',active=false,att=false){return `<button class="stat ${active?'active':''} ${att?'attention':''}" data-action="${action}" data-id="${id}"><span class="stat-label">${label}</span><strong>${value}</strong><span class="stat-foot">${foot}</span></button>`}

/* ============ oturum / auth ekranı ============ */
async function boot(){
  try{
    const st=await api('/status');
    if(st.setup_needed)return renderAuth('setup');
    if(st.user){me=st.user;if(me.must_change)return renderAuth('mustchange');playIntro();return enterApp()}
    renderAuth('login');
  }catch(e){renderAuth('down',e.message)}
}
function nxAuthShell(inner){
  $('#app').innerHTML=`<div class="auth-stage"><div class="auth-bg" id="auth-bg"></div><div class="auth-scrim"></div><div class="auth-center">${inner}</div></div>`;
  const bg=document.getElementById('auth-bg');
  if(bg){const pre=new Image();pre.onload=()=>bg.classList.add('ready');pre.src='img/login-bg.jpg'}
}
function nxAuthBrand(){
  return `<div class="auth-logo"><span class="mark">${NX_LOGO_SVG.replace('nxkg','nxkg3').replace(' class="logo-big"','')}</span><span class="word"><b>koza</b><span>NIATEKS HOUSE</span></span></div>`;
}
function renderAuth(mode,err='',email=''){
  const app=$('#app');
  if(mode==='down'){
    nxAuthShell(`<div class="auth-card">${nxAuthBrand()}<h1>Sunucuya ulaşılamıyor</h1><p class="sub">${esc(err||'')}</p><p class="sub">Yerel test için: "C:/xampp/php/php.exe" -S 127.0.0.1:8090 serve.php komutunu proje klasöründe çalıştırın ve <b>http://127.0.0.1:8090</b> adresini açın.</p></div><div class="auth-note">Niateks House CRM · çok kullanıcılı sürüm · ${APP_VERSION}</div>`);
    return;
  }
  const authErr=t=>{const el=document.getElementById('auth-error');if(el)el.textContent=t};
  const authBtn=dis=>{const f=document.getElementById('auth-form');const b=f&&f.querySelector('button[type=submit]');if(b)b.disabled=dis;return b};
  if(mode==='forgot'){
    nxAuthShell(`<form class="auth-card" id="auth-form">${nxAuthBrand()}<h1>Şifremi unuttum</h1><p class="sub">Hesabınıza kayıtlı e-posta adresinizi girin; geçici şifrenizi bu adrese gönderelim.</p>
      <div class="form-grid" style="grid-template-columns:1fr">
      <label class="field">E-posta<input name="email" type="email" autocomplete="email" required value="${esc(email)}"></label>
      </div><p class="error" id="auth-error" role="alert">${esc(err)}</p>
      <div class="actions" style="margin-top:18px;justify-content:space-between">
        <button class="button ghost" type="button" id="back-login">‹ Girişe geri dön</button>

let forgotTimer=null;
async function loadAuthCaptcha(){
  const box=document.getElementById('captcha-box');if(!box)return;
  try{const r=await api('/captcha');box.innerHTML=r.svg;const inp=document.querySelector('#auth-form [name=captcha]');if(inp)inp.value=''}catch(e){box.innerHTML='<span style="padding:0 10px;color:#8a8272;font-size:11px">Yüklenemedi</span>'}
}
function forgotCountdown(email){
  const btn=document.getElementById('resend');if(!btn)return;
  let left=20;btn.disabled=true;btn.textContent=`Tekrar gönder (${left})`;
  clearInterval(forgotTimer);
  forgotTimer=setInterval(()=>{
    left--;
    if(left>0){btn.textContent=`Tekrar gönder (${left})`;return}
    clearInterval(forgotTimer);btn.disabled=false;btn.textContent='Tekrar gönder';
    btn.onclick=async()=>{
      btn.disabled=true;btn.textContent='Gönderiliyor…';
      try{await api('/forgot',{email});forgotCountdown(email)}
      catch(ex){const el=document.getElementById('auth-error');if(el)el.textContent=ex.message;btn.disabled=false;btn.textContent='Tekrar gönder'}
    };
  },1000);
}

  return {leaves:types.filter(t=>!types.some(x=>x.parent_id===t.id)&&t.active),chainOf};

function productMissing(p){
  const m=[];
  Object.entries(p.attrs||{}).forEach(([k,a])=>{
    if(!a.required)return;const v=(p.vals||{})[k];
    if(a.dtype==='blend'){const sum=Array.isArray(v)?v.reduce((s,r)=>s+(+r.p||0),0):0;if(!Array.isArray(v)||!v.length||Math.round(sum)!==100)m.push(a.label+' (toplam %100 olmalı)')}
    else if(a.dtype==='multi'){if(!Array.isArray(v)||!v.length)m.push(a.label)}
    else if(a.dtype==='bool'){}
    else if(v===null||v===undefined||v==='')m.push(a.label);
  });
  if(!(p.total_qty>0))m.push('Toplam adet');
  if(!(p.price>0))m.push('Hedef birim fiyat');
  if(!p.delivery_date)m.push('Teslim tarihi');
  return m;
}

function productFieldHtml(p,k,a){
  const v=(p.vals||{})[k];
  const lab=`${esc(a.label)}${a.required?' <span class="req">*</span>':''}${a.unit?` <span class="u">(${esc(a.unit)})</span>`:''}`;
  let inp='';
  if(a.dtype==='text')inp=`<input data-pk="${k}" value="${esc(v||'')}">`;
  else if(a.dtype==='number')inp=`<input type="number" data-pk="${k}" ${a.minv!==null?`min="${a.minv}"`:''} ${a.maxv!==null?`max="${a.maxv}"`:''} step="any" value="${esc(v??'')}">`;
  else if(a.dtype==='select')inp=`<select data-pk="${k}"><option value="">Seçin</option>${(a.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(a.dtype==='bool')inp=`<label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" data-pk="${k}" ${v?'checked':''}> Evet</label>`;
  else if(a.dtype==='multi')inp=`<div class="pd-chips">${(a.options||[]).map(o=>`<label><input type="checkbox" data-pmulti="${k}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  else if(a.dtype==='blend'){
    const rows=Array.isArray(v)?v:[];
    inp=`<div>${rows.map((r,i)=>`<div class="pd-line"><input data-pbl="n" data-i="${i}" value="${esc(r.n||'')}" placeholder="Elyaf"><input type="number" data-pbl="p" data-i="${i}" value="${esc(r.p??'')}" placeholder="%" step="any"><button class="button ghost small" data-action="product-del-blend" data-id="${i}">✕</button></div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center"><button class="button small" data-action="product-add-blend" data-id="">+ Elyaf ekle</button><span class="u" id="pd-bsum"></span></div></div>`;
  }
  return `<label class="pd-flabel">${lab}${inp}</label>`;
}

function lbStep(dir){if(!projImages.length)return;lbIndex=(lbIndex+dir+projImages.length)%projImages.length;renderLightbox()}
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lightbox');if(!lb||!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowRight')lbStep(1);

  if(e.key==='+'){lbZoom=Math.min(5,lbZoom+0.4);lbApplyZoom()}

function modal(title,body,submit){

  $('#edit-form').onsubmit=async e=>{
    e.preventDefault();
    const data=Object.fromEntries(new FormData(e.target));
    const sub=e.target.querySelector('button[type=submit]');sub.disabled=true;

  if(fc&&fy)fc.addEventListener('change',()=>{const cs=geoCities(fc.value);fy.innerHTML=cs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')+'<option value="">Diğer / belirsiz</option>'});
}
function taskForm(id='',defaults={}){
  const t=id?cache.tasks.find(x=>x.id==id):{title:'',company_id:'',deal_id:'',project_id:'',owner_id:me.id,due_date:day(),status:'Yapılacak',waiting:'Biz',note:'',...defaults};
  modal(id?'Görevi düzenle':'Yeni görev',
    field('Yapılacak iş','title',t.title,'text',true,true)
    +sel('Müşteri','company_id',companyList(t.company_id))
    +sel('Sorumlu','owner_id',userList(t.owner_id),t.owner_id)
    +field('Termin / tekrar takip','due_date',t.due_date,'date',false,true)
    +sel('Durum','status',TASK_STATUSES,t.status)
    +sel('Beklenen taraf','waiting',WAITING,t.waiting)
    +sel('İlgili fırsat','deal_id',[{value:'',label:'Fırsat yok'},...cache.deals.map(d=>({value:d.id,label:companyName(d.company_id)+' · '+d.title}))],t.deal_id)
    +sel('İlgili proje','project_id',[{value:'',label:'Proje yok'},...cache.projects.map(p=>({value:p.id,label:p.name}))],t.project_id,true)
    +field('Açıklama / bekleme nedeni','note',t.note,'textarea',true),
  async data=>{
    if((data.status==='Bekliyor'||data.waiting!=='Biz')&&!data.note.trim())throw Error('Bekleme nedenini açıklamaya yazın.');
    const payload={...data};['company_id','deal_id','project_id','owner_id'].forEach(k=>payload[k]=payload[k]?Number(payload[k]):0);
    if(id)await api('/tasks/update',{id:Number(id),...payload});else await api('/tasks',payload);
    await refreshAll();toast('Görev '+(id?'güncellendi.':'oluşturuldu.'));
  });
}
function dealForm(id='',cid=''){
  if(!cache.companies.length){toast('Önce bir müşteri ekleyin.');return}
  const d=id?dealById(id):{title:'',company_id:cid||cache.companies[0].id,value:0,currency:'USD',stage:'İhtiyaç',owner_id:me.id,close_date:day(14),note:'',reference:'',loss:''};
  modal(id?'Fırsatı düzenle':'Yeni satış fırsatı',
    field('Fırsat adı','title',d.title,'text',true,true)
    +sel('Müşteri','company_id',cache.companies.map(c=>({value:c.id,label:c.name})),d.company_id)
    +sel('Sorumlu','owner_id',userList(d.owner_id),d.owner_id)
    +field('Tahmini tutar','value',d.value,'number',false,true)
    +sel('Para birimi','currency',CURRENCIES,d.currency)
    +sel('Satış aşaması','stage',[...STAGES,'Kazanıldı','Kaybedildi'],d.stage)
    +field('Hedef kapanış','close_date',d.close_date,'date',false,true)
    +field('Sipariş / onay referansı','reference',d.reference,'text',true)
    +field('Kaybedilme nedeni','loss',d.loss,'text',true)
    +field('İşin kapsamı ve notlar','note',d.note,'textarea',true)
    +'<span class="help field full">Kazanıldı için onay referansı; Kaybedildi için neden gereklidir.</span>',
  async data=>{
    if(data.stage==='Kazanıldı'&&!data.reference.trim())throw Error('Kazanıldı aşaması için sipariş veya yazılı onay referansı gerekli.');
    if(data.stage==='Kaybedildi'&&!data.loss.trim())throw Error('Kaybedilme nedenini girin.');

    if(id)await api('/deals/update',{id:Number(id),...payload});else await api('/deals',payload);

function userForm(id){
  const u=id?users.find(x=>x.id==id):{username:'',name:'',email:'',role:'agent'};
  modal(id?'Kullanıcıyı düzenle':'Yeni kullanıcı',
    (id?'':field('Kullanıcı adı','username',u.username,'text',false,true))
    +field('Ad Soyad','name',u.name,'text',false,true)+field('E-posta','email',u.email,'email')
    +sel('Rol','role',[{value:'agent',label:'Temsilci'},{value:'manager',label:'Yönetici'}],u.role)
    +(id?'':`<label class="field full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="auto_password" checked style="width:auto"> Şifreyi otomatik üret ve e-postayla gönder</label>
      <span class="help field full">Geçici şifre otomatik üretilir ve kullanıcıya e-posta ile gönderilir; ilk girişte değiştirilmesi zorunlu tutulur. E-posta alanını boş bırakırsanız şifre yalnızca ekranda gösterilir.</span>
      <div data-manual-pw style="display:none">${field('Şifre','password','','password',false,true)}<span class="help field full">En az 10 karakter. Kullanıcı ilk girişinde bu şifreyle girer.</span></div>`),
  async data=>{
    let created=null;
    if(id)await api('/users/update',{id,...data});
    else created=await api('/users',data);
    if(created&&created.password){
      if(created.mail_sent)toast('Kullanıcı eklendi. Geçici şifre e-postayla gönderildi.');
      else{toast('Kullanıcı eklendi; e-posta gönderilemedi. Geçici şifreyi kaydedin.');prompt('Geçici şifreyi kopyalayın ('+(created.user&&created.user.email?created.user.email:created.user&&created.user.username)+'):',created.password)}
    }else toast('Kullanıcı '+(id?'güncellendi.':'eklendi.'));
    const r=await api('/users');users=r.users;await refreshAll();
  });
  if(!id){
    const f=document.getElementById('edit-form');
    const cb=f&&f.querySelector('[name=auto_password]');
    const man=f&&f.querySelector('[data-manual-pw]');
    if(cb&&man){
      const syncPw=()=>{man.style.display=cb.checked?'none':'block';const inp=man.querySelector('[name=password]');if(inp)inp.required=!cb.checked};
      syncPw(); // acilista da uygula: otomatik seciliyken gizli required alani submit'i engellemesin
      cb.onchange=syncPw;
    }
  }
}

/* ============ olaylar ============ */

  if(e.target.closest('.ct-del')){const row=e.target.closest('.contact-row');const list=row.parentElement;if(list.children.length>1){row.remove();if(!list.querySelector('input[name=ct-primary]:checked'))list.querySelector('.contact-row input[name=ct-primary]').checked=true}else{toast('En az bir yetkili kalmalı.')}return}
  if(a==='contact-add'){const list=document.getElementById('contact-list');if(list&&list.children.length<10){list.insertAdjacentHTML('beforeend',contactRowHtml({name:'',title:'',email:'',phone:'',is_primary:!list.querySelector('input[name=ct-primary]:checked')},list.children.length));list.lastElementChild.querySelector('[name=ct-name]').focus()}else{toast('En fazla 10 yetkili ekleyebilirsiniz.')}return}
  if(e.target.closest('.phone-del')){const row=e.target.closest('.phone-row');const list=row.parentElement;if(list.children.length>1){row.remove()}return}
  (async()=>{
    if(a==='nav'){if(id==='customers')customerTab='overview';if(id==='logins'){view='log';logTab='giris';id='log'}view=id;selected='';query='';const s=$('#search');if(s)s.value='';ownerFilter='';$('#sidebar').classList.remove('open');$('.mobile-menu')?.setAttribute('aria-expanded','false');
      if(id==='log'){try{const qs=new URLSearchParams();if(logFilter.username)qs.set('username',logFilter.username);if(logFilter.entity)qs.set('entity',logFilter.entity);if(logFilter.q)qs.set('q',logFilter.q);const r=await api('/log'+(qs.toString()?'?'+qs:''));cache.log=r.log;cache.logUsers=r.users||[];const lg=await api('/logins');loginsCache=lg.logins||[];cache.loginsShowIp=!!lg.show_ip}catch(err){toast(err.message)}}
      render();window.scrollTo({top:0});}
    else if(a==='menu'){$('#sidebar').classList.toggle('open');el.setAttribute('aria-expanded',$('#sidebar').classList.contains('open'))}
    else if(a==='close')$('#modal').close();
    else if(a==='home-filter'){homeFilter=id;render()}
    else if(a==='task-filter'){taskFilter=id;render()}
    else if(a==='customer-tab'){customerTab=id;render()}
    else if(a==='company-open'){customerTab='overview';view='customers';selected=Number(id);render()}
    else if(a==='project-open'){view='projects';selected=Number(id);render()}
    else if(a==='company-new')companyForm();
    else if(a==='company-edit')companyForm(Number(id));
    else if(a==='company-del'){if(confirm('Bu müşteriyi silmek istediğinize emin misiniz? Bağlı kayıtlar görünmez olur.')){try{await api('/companies/delete',{id:Number(id)});selected='';await refreshAll();toast('Müşteri silindi.')}catch(err){toast(err.message)}}}
    else if(a==='task-new')taskForm('',id?{company_id:Number(id)}:{});
    else if(a==='task-edit')taskForm(id);
    else if(a==='deal-new')dealForm('',id?Number(id):'');
    else if(a==='deal-edit')dealForm(Number(id));
    else if(a==='project-new')projectForm();
    else if(a==='project-edit')projectForm(Number(id));
    else if(a==='note-new')noteForm(Number(id));
    else if(a==='deal-task'){const d=dealById(Number(id));taskForm('',{company_id:d.company_id,deal_id:d.id,owner_id:d.owner_id})}
    else if(a==='project-task'){const p=projectById(Number(id));taskForm('',{company_id:p.company_id,project_id:p.id,owner_id:p.owner_id})}
    else if(a==='complete'){try{await api('/tasks/toggle',{id:Number(id)});await refreshAll();toast('Görev durumu güncellendi.')}catch(err){toast(err.message)}}
    else if(a==='step-new'){modal('İş adımı ekle',field('Adım adı','title','','text',true,true),async data=>{if(!data.title.trim())throw Error('Adım adını yazın.');await api('/projects/steps',{project_id:Number(id),add_title:data.title});await refreshAll();toast('İş adımı eklendi.')})}
    else if(a==='img-pick'){const inp=document.getElementById('img-input');if(inp)inp.click()}
    else if(a==='img-del'){if(confirm('Bu görseli silmek istediğinize emin misiniz?')){try{await api('/projects/images/delete',{id:Number(id)});projImages=projImages.filter(x=>x.id!==Number(id));const pid=selected;loadProjectImages(pid);toast('Görsel silindi.')}catch(err){toast(err.message)}}}
    else if(a==='person-tasks'){view='tasks';ownerFilter=(users.find(u=>u.name===id)||{}).id||'';taskFilter='open';render()}
    else if(a==='user-new')userForm();
    else if(a==='user-edit')userForm(Number(id));
    else if(a==='user-reset'){modal('Şifre sıfırla',field('Yeni şifre','password','','password',true,true)+'<span class="help field full">En az 10 karakter.</span>',async data=>{await api('/users/reset',{id:Number(id),password:data.password});const r=await api('/users');users=r.users;toast('Şifre sıfırlandı.')})}
    else if(a==='user-deactivate'){if(confirm('Bu kullanıcı devre dışı bırakılsın mı? Giriş yapamayacak, kayıtları korunur.')){try{await api('/users/deactivate',{id:Number(id)});const r=await api('/users');users=r.users;render();toast('Kullanıcı devre dışı bırakıldı.')}catch(err){toast(err.message)}}}
    else if(a==='log-tab'){logTab=id;if(logTab==='giris'&&!loginsCache.length){try{const lg=await api('/logins');loginsCache=lg.logins||[];cache.loginsShowIp=!!lg.show_ip}catch(err){toast(err.message)}}render()}
    else if(a==='log-clear'){logFilter={username:'',entity:'',q:''};view='log';try{const r=await api('/log');cache.log=r.log;cache.logUsers=r.users||[];const lg=await api('/logins');loginsCache=lg.logins||[];cache.loginsShowIp=!!lg.show_ip}catch(err){toast(err.message)}render()}
    else if(a==='product-open'){openProductDrawer(Number(id))}
    else if(a==='product-new'){openProductModal(null)}
    else if(a==='product-add-dist'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p){p.dist.push({label:'',qty:0});renderProductDrawer()}}
    else if(a==='product-del-dist'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p&&(p.dist||[]).length>1){p.dist.splice(Number(id),1);renderProductDrawer()}else if(p)toast('Dağılımda en az 1 satır kalmalı.')}
    else if(a==='product-add-custom'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p){p.custom.push({label:'',value:'',unit:''});renderProductDrawer()}}
    else if(a==='product-del-custom'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p){p.custom.splice(Number(id),1);renderProductDrawer()}}
    else if(a==='product-add-blend'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p){p.vals.fiber=Array.isArray(p.vals.fiber)?p.vals.fiber:[];p.vals.fiber.push({n:'',p:''});renderProductDrawer()}}
    else if(a==='product-del-blend'){const p=prodCache.find(x=>x.id===prodDrawerId);if(p&&Array.isArray(p.vals.fiber)){p.vals.fiber.splice(Number(id),1);renderProductDrawer()}}
    else if(a==='password-self'){modal('Şifre değiştir',field('Mevcut şifre','old','','password',true,true)+field('Yeni şifre','new','','password',true,true)+'<span class="help field full">En az 10 karakter.</span>',async data=>{await api('/password',data);toast('Şifreniz güncellendi.')})}
    else if(a==='logout'){try{await api('/logout',{})}catch(e){}location.reload()}
  })().catch(err=>toast(err.message));
});
/* ürün drawer: alan girişleri + kapatma */
document.getElementById('pdrawer').addEventListener('input',e=>{
  const p=prodCache.find(x=>x.id===prodDrawerId);if(!p)return;
  const t=e.target,d=t.dataset;
  if(t.dataset.pname!==undefined){p.name=t.value;document.getElementById('pd-title').textContent=t.value}
  else if(d.pk!==undefined&&d.pk){p.vals[d.pk]=t.type==='checkbox'?t.checked:t.value}
  else if(d.pmulti){const arr=Array.isArray(p.vals[d.pmulti])?p.vals[d.pmulti]:[];const i=arr.indexOf(t.value);if(t.checked){if(i<0)arr.push(t.value)}else if(i>=0)arr.splice(i,1);p.vals[d.pmulti]=arr}
  else if(d.pbl){p.vals.fiber=p.vals.fiber||[];if(p.vals.fiber[+d.i])p.vals.fiber[+d.i][d.pbl]=t.type==='number'?t.value:t.value}
  else if(d.pd){if(p.dist[+d.i])p.dist[+d.i][d.pd]=t.value}
  else if(d.pc){p[d.pc]=t.value}
  else if(d.pcf){if(p.custom[+d.i])p.custom[+d.i][d.pcf]=t.value}
  else return;
  productDerived();
});

document.addEventListener('keydown',e=>{

/* görsel galerisi + lightbox etkileşimleri */
document.addEventListener('click',e=>{
  const shot=e.target.closest('.shot');
  if(shot&&!e.target.closest('.shot-del')){openLightbox(Number(shot.dataset.i));return}
  const lbBtn=e.target.closest('[data-lb]');
  if(lbBtn){const a=lbBtn.dataset.lb;const lb=document.getElementById('lightbox');
    if(a==='close')lb.classList.remove('open');
    if(a==='prev')lbStep(-1);if(a==='next')lbStep(1);
    if(a==='zoomin'){lbZoom=Math.min(5,lbZoom+0.4);lbApplyZoom()}
    if(a==='zoomout'){lbZoom=Math.max(1,lbZoom-0.4);lbApplyZoom()}
    if(a==='zoomreset'){lbZoom=1;lbApplyZoom()}
    if(a==='delete'){const im=projImages[lbIndex];if(im&&confirm('Bu görseli silmek istediğinize emin misiniz?')){(async()=>{try{await api('/projects/images/delete',{id:im.id});projImages.splice(lbIndex,1);lb.classList.remove('open');if(selected)loadProjectImages(selected);toast('Görsel silindi.')}catch(err){toast(err.message)}})()} }
    return;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='img-input'&&e.target.files.length){const pid=selected;uploadImages(e.target.files,pid);e.target.value=''}
});

boot();
